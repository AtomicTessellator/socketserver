steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: pull_cache
    entrypoint: 'bash'
    args: ['-c', 'docker pull $LOCATION-docker.pkg.dev/$PROJECT_ID/$_REGISTRY_NAME/$_IMAGE_NAME:$BRANCH_NAME || exit 0']
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: build_image
    args: [
              'build',
              '--file', 'Dockerfile',
              '--platform', 'linux/amd64',
              '-t', '${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_NAME}/${_IMAGE_NAME}:$SHORT_SHA',
              '--cache-from', '${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_NAME}/${_IMAGE_NAME}:$BRANCH_NAME',
              '.'
          ]
    waitFor:
    - pull_cache

  - name: 'gcr.io/cloud-builders/docker'
    id: push_image
    args: ['push', '${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_NAME}/${_IMAGE_NAME}:$SHORT_SHA']
    waitFor:
    - build_image

  - name: 'gcr.io/cloud-builders/git'
    secretEnv: ['SSH_KEY']
    entrypoint: 'bash'
    id: setup_ssh
    args:
    - -c
    - |
      echo "$$SSH_KEY" >> /root/.ssh/id_rsa
      chmod 400 /root/.ssh/id_rsa
      ssh-keyscan -t rsa github.com >> /root/.ssh/known_hosts
    volumes:
    - name: 'ssh'
      path: /root/.ssh
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/git'
    id: clone_atomic_t
    entrypoint: 'bash'
    args:
    - -c
    - |
      git clone --recurse-submodules --depth 1 --single-branch --branch ${_ATOMICT_BRANCH} git@github.com:AtomicTessellator/atomic.t.git
    volumes:
    - name: 'ssh'
      path: /root/.ssh
    waitFor:
    - setup_ssh

  - name: 'gcr.io/cloud-builders/gcloud'
    id: deploy_atomic_t
    entrypoint: 'sh'
    args:
    - -xe
    - -c
    - |
      ls -lat
      cp atomic.t/delivery_pipeline/skaffold.yaml atomic.t/${REPO_NAME}/skaffold.yaml
      cd atomic.t/${REPO_NAME}/
      gcloud deploy releases create \
      '${_IMAGE_NAME}-${BRANCH_NAME}-${SHORT_SHA}' \
      --delivery-pipeline=clusters-pipeline \
      --images=${_IMAGE_NAME}=${LOCATION}-docker.pkg.dev/${PROJECT_ID}/atomictessellator/${_IMAGE_NAME}:${SHORT_SHA} \
      --region=${LOCATION} \
      --skaffold-file=skaffold.yaml
    waitFor:
    - push_image
    - clone_atomic_t

  - name: 'gcr.io/cloud-builders/gcloud'
    id: add_branch_tag
    entrypoint: 'sh'
    args:
    - -c
    - |
      gcloud container images add-tag ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/atomictessellator/${_IMAGE_NAME}:${SHORT_SHA} ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/atomictessellator/${_IMAGE_NAME}:${BRANCH_NAME}
    waitFor:
    - deploy_atomic_t

options:
  logging: CLOUD_LOGGING_ONLY
availableSecrets:
  secretManager:
  - versionName: projects/buildfactory/secrets/atomict-gitrepo/versions/latest
    env: 'SSH_KEY'
substitutions:
  _IMAGE_NAME: ${REPO_NAME}
  _ATOMICT_BRANCH: master
  _REGISTRY_NAME: atomictessellator
images: 
- ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY_NAME}/${_IMAGE_NAME}:${SHORT_SHA}